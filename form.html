<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apply to AltSchool</title>
  </head>
  <body>
    <header id="top">
      <nav aria-label="Main navigation">
        <a href="index.html" title="Profile page">Home</a>&nbsp;&nbsp;
        <a href="form.html" title="Application form">Apply to AltSchool</a>
      </nav>
      <hr />
      <h1>
        <big><strong>Apply to AltSchool</strong></big>
      </h1>
      <p><em>Create your account · School of Engineering · Karatu 2026</em></p>
      <hr />
    </header>

    <main>
      <form action="#" method="post" aria-label="Create account form">
        <div>
          <label for="email">Email</label><br />
          <input
            type="email"
            id="email"
            name="email"
            value=""
            placeholder="johndoe@email.com"
          />
        </div>

        <div>
          <label for="firstName">First name</label><br />
          <input
            type="text"
            id="firstName"
            name="firstName"
            value="John"
            placeholder="John"
          />
        </div>

        <div>
          <label for="lastName">Last name</label><br />
          <input
            type="text"
            id="lastName"
            name="lastName"
            value="Doe"
            placeholder="Doe"
          />
        </div>

        <div>
          <label for="phone">Phone number</label><br />
          <input
            type="tel"
            id="phone"
            name="phone"
            value=""
            placeholder="+2347017041247"
          />
        </div>

        <div>
          <label for="password">Password</label><br />
          <input
            type="password"
            id="password"
            name="password"
            value="********"
            placeholder="••••••••"
          />
        </div>

        <div>
          <input type="checkbox" id="terms" name="terms" />
          <label for="terms">
            By clicking Create account, I agree to
            <a
              href="https://altschoolafrica.com/terms-and-conditions"
              target="_blank"
              >Terms of Use</a
            >
            and acknowledge that I have read the
            <a href="https://altschoolafrica.com/privacy-policy" target="_blank"
              >Privacy Policy</a
            >.
          </label>
        </div>

        <button type="submit">
          Create account <span aria-hidden="true">></span>
        </button>
      </form>
    </main>

    <hr />
    <footer>
      <p>
        <a href="#top" title="Return to top of page">Back to top</a>
      </p>

        Samuel Efa-Iwa Elemi<br />
        Ogun, Nigeria<br />

          >elemisamuel77@gmail.com</a
        >
      </address>
      <p>
        <small>&copy; 2026 Samuel Elemi (elemz). All rights reserved.</small>
      </p>
    </footer>
  </body>
</html>
